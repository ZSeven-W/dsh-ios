# Build and run the full fixture suite on every push and PR.
#
# Three jobs, cheapest first:
#
#   linux    build plus the two host-agnostic static smokes — the fast gate
#   macos    typecheck and every fixture suite, on the platform whose toolchain
#            this plugin actually talks about
#   sim      boots a real simulator; experimental, so a flaky boot cannot block
#
# DSH_IOS_SMOKE_SKIP_SIM=1 keeps the first two deterministic. A green check is
# therefore not a claim that a device works: the real-device path is verified
# by a human, on a phone, against the checklist in the README.
name: Plugin check

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Node 24 / build + static smokes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Static smoke — simulator panel (SSR only)
        run: node scripts/dev-panel-smoke.mjs
      - name: Static smoke — conversation cards (no simulator)
        run: node scripts/dev-card-smoke.mjs
        env:
          DSH_IOS_SMOKE_SKIP_SIM: '1'

  macos:
    name: Node 24 / fixture suites (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Fixture suites
        run: pnpm test
        env:
          DSH_IOS_SMOKE_SKIP_SIM: '1'

  sim:
    # Experimental: boots a real iOS simulator on the macOS runner. Marked
    # continue-on-error so a flaky simulator boot cannot block a PR.
    name: macOS / live simulator smoke (experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Live simulator smoke (boots a simulator)
        run: node scripts/dev-smoke.mjs
