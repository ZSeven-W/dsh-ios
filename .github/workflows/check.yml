# Build and run the full fixture suite on every push and PR.
#
# macOS, not ubuntu: this plugin's whole subject is Xcode tooling, so the
# platform that can actually resolve `xcrun`, AXe and the Simulator frameworks
# is the honest place to test it, even when the run itself touches no device.
#
# DSH_IOS_SMOKE_SKIP_SIM=1 keeps CI deterministic: the suites cover backends,
# fences, tool schemas and the playbook from fixtures, while the parts that
# need a booted simulator or a USB-connected iPhone stay a local, human-run
# step. A green run here is not a claim that a device works — see the
# real-device checklist in the README.
name: Plugin check

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Node 24 / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Fixture suites
        run: pnpm test
        env:
          DSH_IOS_SMOKE_SKIP_SIM: '1'
