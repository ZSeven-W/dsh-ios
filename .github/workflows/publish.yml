name: Publish npm package

# Triggered on a v* tag push — installs the locked devDependencies, builds
# the plugin, verifies the package.json version against the tag, and
# publishes @zseven-w/dsh-ios to the public npm registry.
#
# Requires the repository secret:
#   NPM_TOKEN   npm registry automation token for publishing (public registry)
#
# Prerelease versions (0.x.0-rc.*) publish under the `next` dist-tag, so
# the `latest` tag is never silently moved by an rc release.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build and publish @zseven-w/dsh-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Verify package version matches tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version $VERSION does not match tag $TAG"
            exit 1
          fi
      - name: Choose npm dist-tag
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          npm whoami
      - name: Publish npm package
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}
